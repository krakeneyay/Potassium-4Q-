<!DOCTYPE html>
<html>

<head>
    <title>My First Webpage</title>

    <meta charset="UTF-8">
    <meta name="author" content="jef">

</head>

<body>
    <form name="information" action="checkout.html" onsubmit="validInformation()">
        <label for="name">Name: </label>
        <input type="text" name="name" id="name" >
        <br><br>
        <label for="apple">How many apple do you want to purchase? </label>
        <input type="number" name="apple" id="apple" min="0" required>
        <br><br>
        <label for="juice">How many juice do you want to purchase? </label>
        <input type="number" name="juice" id="juice" min="0" required>
        <br><br>
        <label for="pay">How much money do you have? </label>
        <input type="number" name="pay" id="pay" min="0" required>
        <br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
    <script src="index.js"></script>
</body>

</html>
