<!DOCTYPE html>
<html>
    <head>
        <title>My First Website</title>

        <meta charset="UTF-8">
        <meta name= "author" conenent="jef">
    </head>
    <body>
        <form name="checkoutForm" action="checkout.html" onsubmit="return validateForm();">
            <label for="username">Username:</label>
            <input type="text" name="username" id="username" required>

            <br><br>
            
            <input type="cart" name="apple" id="apple">
            <label for="apple">Apple : P50/piece</label>
            <br>
            <label for="amount_apple">Amount:</label>
            <input type="number" name="amount_apple" id="amount_apple" required min="0" placeholder="how many?">

            <br><br>

            <input type="cart" name="juice" id="juice">
            <label for="juice">Juice : P20/piece</label>
            <br>
            <label for="amount_juice">Amount:</label>
            <input type="number" name="amount_juice"id="amount_juice" required min="0" placeholder="how many do you want?">

            <br><br>

            <label for="money">Money for Payment</label>
            <input type="number" name="money" id="money" required>

            <br><br>

            <button type="submit">Submit</button>
        </form>

        <script src="index.js"></script>
    </body>
<html>
